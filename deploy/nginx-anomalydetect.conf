# Site do AnomalyDetect no Nginx que já roda na VPS. Troque SEU-NOME.duckdns.org pelo domínio;
# o HTTPS é acrescentado depois pelo certbot (passo a passo em DEPLOY.md).
server {
    listen 80;
    listen [::]:80;
    server_name SEU-NOME.duckdns.org;

    # API direto no backend, com o IP de quem conectou: o limite de tentativas de login
    # conta por pessoa. Sobrescrever os dois cabeçalhos impede o cliente de escolher o IP.
    location /api/ {
        proxy_pass http://127.0.0.1:18301;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Tempo real do painel
    location /ws/ {
        proxy_pass http://127.0.0.1:18301;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_set_header Host $host;
    }
}

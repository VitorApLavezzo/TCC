services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anomaly_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/anomaly_db
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:14b
    volumes:
      - ./backend:/app
      - ml_models:/app/ml/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      AGENT_API_URL: http://backend:8000
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      COLLECTION_INTERVAL: ${COLLECTION_INTERVAL:-30}
    privileged: true
    depends_on:
      - backend

volumes:
  postgres_data:
  ml_models:
  ollama_data:

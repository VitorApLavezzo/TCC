services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Senha por instalação (start.sh gera). O padrão "postgres" só existe
      # para não quebrar bancos já criados com ela; troque em produção.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: anomaly_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Só na própria máquina: o backend fala com o banco pela rede do Compose,
    # e a porta publicada serve apenas para rodar o backend fora do Docker.
    # Em todas as interfaces, qualquer computador da rede entrava como
    # superusuário — e com o banco na mão, mandava comandos aos agentes.
    ports:
      - "127.0.0.1:5432:5432"

  # Cópia do banco a cada 6 horas em ./backups, guardando 14 dias. Os dados de
  # coleta do TCC já sumiram uma vez sem cópia nenhuma. Roda com o usuário do
  # host para os arquivos não nascerem do root. Como restaurar: scripts/backup.sh
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: anomaly_db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  # Opcional — só sobe com: docker compose --profile local-ollama up -d
  # Use quando o stack rodar na mesma máquina que tem a GPU.
  # Se o Ollama roda em OUTRA máquina (ex: seu PC), deixe desligado e
  # aponte OLLAMA_BASE_URL no .env para o IP dela.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    profiles: ["local-ollama"]
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama_data:/root/.ollama
    # A API do Ollama não tem autenticação: só a própria máquina alcança
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build: ./backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/anomaly_db
      # Obrigatória: com uma chave conhecida, qualquer um assina sessão de
      # qualquer conta. start.sh gera uma ao criar o .env.
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env (python3 -c "import secrets; print(secrets.token_urlsafe(48))")}
      LEDGER_HMAC_KEY: ${LEDGER_HMAC_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_USERNAME: ${OLLAMA_USERNAME:-}
      OLLAMA_PASSWORD: ${OLLAMA_PASSWORD:-}
      LLM_LOCAL_FIRST: ${LLM_LOCAL_FIRST:-true}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      CLOUD_LLM_API_KEY: ${CLOUD_LLM_API_KEY:-}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-llama-3.3-70b-versatile}
      # Claude Code CLI headless como provedor de explicações
      CLAUDE_CLI_ENABLED: ${CLAUDE_CLI_ENABLED:-false}
      CLAUDE_CLI_MODEL: ${CLAUDE_CLI_MODEL:-sonnet}
      CLAUDE_CLI_TIMEOUT: ${CLAUDE_CLI_TIMEOUT:-120}
      # Endereço público do painel (links em Telegram/e-mail)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Notificações por Telegram (long polling; vazio desativa)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Notificações por e-mail (vazio desativa)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Reputação coletiva de executáveis (opcional)
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      REPUTATION_HUB_URL: ${REPUTATION_HUB_URL:-}
      REPUTATION_HUB_ACCEPT: ${REPUTATION_HUB_ACCEPT:-false}
      REPUTATION_HUB_KEYS: ${REPUTATION_HUB_KEYS:-}
      REPUTATION_HUB_KEY: ${REPUTATION_HUB_KEY:-}
      # Detecção de anomalias
      ML_ALERT_PERCENTILE: ${ML_ALERT_PERCENTILE:-1.0}
      ML_SVM_CONFIRM: ${ML_SVM_CONFIRM:-false}
      DEFAULT_TZ_OFFSET_MINUTES: ${DEFAULT_TZ_OFFSET_MINUTES:--180}
      # Energia
      DEFAULT_TARIFF_KWH: ${DEFAULT_TARIFF_KWH:-0.85}
      DEFAULT_CO2_KG_PER_KWH: ${DEFAULT_CO2_KG_PER_KWH:-0.0385}
      # Segurança da API (origens do CORS e limite de tentativas por IP)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Rede do Nginx do Compose: só dela o X-Real-IP é aceito como IP do cliente
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # Avisos no celular (Web Push). Vazio desativa o canal.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT_EMAIL: ${VAPID_CONTACT_EMAIL:-}
      # Deriva do modelo
      DRIFT_WARN: ${DRIFT_WARN:-0.20}
      DRIFT_CRITICAL: ${DRIFT_CRITICAL:-0.35}
      DRIFT_RECENT_SAMPLES: ${DRIFT_RECENT_SAMPLES:-300}
      # Automações: janela de arrependimento e teto diário
      PLAYBOOK_UNDO_SECONDS: ${PLAYBOOK_UNDO_SECONDS:-120}
      PLAYBOOK_DAILY_LIMIT: ${PLAYBOOK_DAILY_LIMIT:-10}
    volumes:
      - ./backend:/app
      - ./agent:/app/agent_dist:ro
      # ~/.claude do host, somente-leitura: o entrypoint copia a credencial
      # para dentro do container, então a renovação do token nunca escreve aqui
      - ${CLAUDE_HOST_CONFIG:-./.claude-host}:/claude-host:ro
      - ml_models:/app/ml/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      AGENT_API_URL: http://backend:8000
      AGENT_API_TOKEN: ${AGENT_API_TOKEN:-}
      AGENT_ENROLL_CODE: ${AGENT_ENROLL_CODE:-}
      AGENT_CONFIG_DIR: /app/data
      AGENT_NO_TRAY: "1"
      COLLECTION_INTERVAL: ${COLLECTION_INTERVAL:-30}
      AGENT_ADAPTIVE: ${AGENT_ADAPTIVE:-1}
    volumes:
      - agent_data:/app/data
    privileged: true
    depends_on:
      - backend

volumes:
  postgres_data:
  ml_models:
  ollama_data:
  agent_data:
